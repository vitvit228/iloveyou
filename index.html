<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фон -->
  <div id="bg"></div>

  <!-- Треугольник play -->
  <div id="play-btn">
    <div class="triangle"></div>
  </div>

  <!-- Скример -->
  <div id="screamer"></div>

  <!-- Кнопка повтора (появляется после скримера) -->
  <button id="replay-btn">Повторить</button>

  <!-- Скрытые аудио -->
  <audio id="main-sound" src="sound.mp3" preload="auto"></audio>
  <audio id="scream-sound" src="scream.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
